{{define "feedSwiper"}}
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
<swiper-container class="w-full flex-1 overflow-hidden" slides-per-view="1" direction="vertical" id="feed-swiper">
	{{template "feedSwiperSlides" .}}
	<swiper-slide id="feed-swiper-slide-last">
		<div class="w-full h-full bg-neutral-800 animate-pulse"></div>
	</swiper-slide>
</swiper-container>

<script>
	const loadNextURL = "{{.LoadNextURL}}?no-cache=true";
	const slideChangedURL = "{{.SlideChangedURL}}?no-cache=true";
	const swiper = document.getElementById("feed-swiper");
	const swiperSlideLast = document.getElementById("feed-swiper-slide-last");
	const preloadThreshold = 4;

	async function workerLoadNext() {
		while (true) {
			try {
				await new Promise(r =>
					swiper.addEventListener("swiperslidechange", r, { once: true })
				);
				if (swiper.swiper.activeIndex < swiper.swiper.slides.length - preloadThreshold) continue;
				const res = await fetch(loadNextURL);
				const html = await res.text();
				swiperSlideLast.insertAdjacentHTML("beforebegin", html);
			} catch (err) {
				console.error("Failed to load next slides", err);
			}
		}
	}

	async function workerSaveFeedIndex() {
		while (true) {
			try {
				await new Promise(r =>
					swiper.addEventListener("swiperslidechange", r, { once: true })
				);
				const url = new URL(slideChangedURL, window.location.origin);
				url.searchParams.set("feedIndex", swiper.swiper.activeIndex.toString());
				await fetch(url.toString(), {
					method: "POST",
					headers: { "Content-Type": "application/json" },
				});
			} catch (err) {
				console.error("Failed to save feed index", err);
			}
		}
	}

	workerLoadNext();
	workerSaveFeedIndex();
</script>
{{end}}
