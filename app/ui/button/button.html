{{define "button"}}
{{$baseClasses := "text-white px-5 py-3 text-lg rounded-md bg-blue-500 font-bold active:bg-blue-600 cursor-pointer"}}
{{if .Href}}
<a href="{{.Href}}" class="{{$baseClasses}} {{.Class}} inline-block">
    {{.Text}}
</a>
{{else}}
<button type="{{.Type}}" class="{{$baseClasses}} {{.Class}} disabled:opacity-50 disabled:cursor-not-allowed">
    {{.Text}}
    <!-- {{template "spinner" (dict "Class" "size-9")}}Ø -->
</button>
{{end}}
{{end}}
