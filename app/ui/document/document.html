<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>moviefinder.app</title>
  <meta name="description" content="Movie finder" />
  <script type="module"
    src="https://cdn.jsdelivr.net/gh/starfederation/datastar@v1.0.0-beta.11/bundles/datastar.js"></script>
  <link rel="icon" href="favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="output.css" />
  {{if .Document}}
  {{if .Document.Preload}}
  {{range .Document.Preload}}
  <link rel="prerender" href="{{.Href}}?no-cache=true" as="document" crossorigin="anonymous" />
  <link rel="prefetch" href="{{.Href}}?no-cache=true" as="document" crossorigin="anonymous" />
  {{end}}
  {{end}}
  {{end}}
</head>

<body class="bg-black text-white grid place-items-center w-[100dvw] h-[100dvh] overflow-hidden">
  <div
    class="w-full h-full max-w-[600px] max-h-[900px] border rounded overflow-hidden flex flex-col border-neutral-600">
    {{ template "page" . }}
  </div>
</body>

</html>
