{{ define "mainMenu" }}
<script src="https://cdn.jsdelivr.net/npm/swiper@11/swiper-element-bundle.min.js"></script>
<section>
    <ul>
        {{range .MainMenu.Items}}
        <li>
            <a href={{.URL}}>
                <strong>{{.Label}}</strong>
            </a>
            <p>{{.Description}}</p>
        </li>
        {{end}}
    </ul>
</section>
{{ end }}
