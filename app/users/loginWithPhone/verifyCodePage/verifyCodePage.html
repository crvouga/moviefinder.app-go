{{define "page"}}
{{template "topBar" .TopBar}}
<form class="flex-1 w-full p-6 flex flex-col gap-12" method="POST"
    onsubmit="this.querySelectorAll('input,button').forEach(e => e.disabled = true);">
    <p>Enter the code sent to <strong>{{.PhoneNumber}}</strong></p>
    {{template "textField" .TextFieldCode}}
    {{template "button" .ButtonVerifyCode}}
    {{if .Error}}
    <p class="text-red-500 text-xl font-bold">{{.Error}}</p>
    {{end}}
</form>
{{end}}
